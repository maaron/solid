[package]
name = "solid_modeling"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "27"
winit = "0.30"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.29"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
once_cell = "1.19"
nom = "7.1"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"

[lib]
name = "solid_modeling"
path = "src/lib.rs"

[[bin]]
name = "solid_viewer"
path = "src/main.rs"

[[example]]
name = "lang_examples"
path = "examples/lang_examples.rs"

[[example]]
name = "parser_examples"
path = "examples/parser_examples.rs"

[[example]]
name = "field_zero_examples"
path = "examples/field_zero_examples.rs"
